services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis:8
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app_network

  fastapi_app:
    build:
      context: ./backend
    container_name: fastapi_app
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: >
      uv run uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    volumes:
      - ./backend:/app
    networks:
      - app_network

  celery:
    build:
      context: ./backend
    container_name: celery_container
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    command: >
      uv run celery
      -A app.tasks.celery_app.celery_app
      worker
      --loglevel=info
    volumes:
      - ./backend:/app
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: always
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - fastapi_app
    networks:
      - app_network

networks:
  app_network:

volumes:
  postgres_data:
  redis_data:
