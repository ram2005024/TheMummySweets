services:
postgres:
  image: postgres:17
  container_name: postgres
  restart: unless-stopped
  env_file:
    - ./backend/.env
  ports:
    - "127.0.0.1:5432:5432"
  volumes:
    - postgres_data:/var/lib/postgresql/data
  networks:
    - app_network

  redis:
    image: redis:8
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  fastapi_app:
    build:
      context: ./backend
    container_name: fastapi_app
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: >
      uv run uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    volumes:
      - ./backend:/app

  celery:
    build:
      context: ./backend
    container_name: celery_container
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    command: >
      uv run celery
      -A app.tasks.celery_app.celery_app
      worker
      --loglevel=info
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000/api/v1
    container_name: frontend
    restart: always
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - fastapi_app

volumes:
  postgres_data:
  redis_data:
