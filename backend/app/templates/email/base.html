<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; background: #fff8f0; }
        .container { max-width: 600px; margin: 20px auto; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; }
        .header { background: #d35400; color: #fff; padding: 20px; text-align: center; }
        .header h2 { margin: 0; font-size: 24px; }
        .content { padding: 20px; color: #333; line-height: 1.6; }
        .footer { background: #f1f1f1; color: #555; padding: 15px; text-align: center; font-size: 12px; }
        .btn { display: inline-block; padding: 10px 20px; background: #e67e22; color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .btn:hover { background: #d35400; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Mummy Sweets Corner</h2>
            <p>Delicious homemade sweets & snacks</p>
        </div>

        <div class="content">
            {% block content %}
            <!-- Email-specific content goes here -->
            {% endblock %}
        </div>

        <div class="footer">
            <p>&copy; 2026 Mummy Sweets Corner. All rights reserved.</p>
            <p>Follow us on Instagram & Facebook for daily specials!</p>
        </div>
    </div>
</body>
</html>
